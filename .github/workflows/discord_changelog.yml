name: Push changelog to Discord

on:
  push:
    branches:
      - main

jobs:
  send-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read latest changelog section and send to Discord
        run: |
          # Načítaj poslednú sekciu changelogu
          LAST_CHANGELOG=$(awk '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              found=1
              sub(/^## /, "")
            }
            found { print }
          ' CHANGELOG.md)

          # Vytvor správu s reálnymi novými riadkami
          CONTENT=$(printf "🛠️ **Nový update AstroMiner!**\n\n%s" "$LAST_CHANGELOG")

          echo -e "📦 Odosielam na Discord:\n$CONTENT"

          # Priprav JSON payload s opravou nových riadkov
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')

          # Pošli payload na Discord webhook
          curl -X POST -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "$WEBHOOK_URL"
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}